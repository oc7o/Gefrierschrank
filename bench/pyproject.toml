[project]
name = "gsbench"
version = "0.1.0"
description = "End-to-end benchmark and correctness gate: Gefrierschrank vs. Elasticsearch restore + PIT export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.1",
    "psutil>=7.0",
    "pyarrow>=20.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
gsbench = "gsbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
